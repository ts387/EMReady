name: emready_env
channels:
  - defaults
  - pytorch
  - conda-forge
dependencies:
  - python=3.9
  - pip=23.3
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - torchaudio>=2.1.0
  # Note: MKL is Intel-specific and not needed on Apple Silicon
  # Apple's Accelerate framework provides optimized BLAS/LAPACK
  - numba==0.60.0
  - pip:
    - biopython==1.81
    - einops==0.6.1
    - mrcfile==1.3.0
    - numpy==1.24.2
    - timm==0.9.2
    - tqdm==4.60.0
