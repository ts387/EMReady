name: emready_env
channels:
  - defaults
  - pytorch
  - conda-forge
dependencies:
  - python=3.9
  - pip=23.3
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - torchaudio>=2.1.0
  # Platform-specific GPU support:
  # - For Linux with NVIDIA GPUs: use environment_linux.yml (includes pytorch-cuda)
  # - For macOS with M-Series: use environment_macos.yml (MPS support built-in)
  # This generic file is for CPU-only or development use
  - numba==0.60.0
  - pip:
    - biopython==1.81
    - einops==0.6.1
    - mrcfile==1.3.0
    - numpy==1.24.2
    - timm==0.9.2
    - tqdm==4.60.0
